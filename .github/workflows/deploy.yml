name: Deploy VitePress site to GitHub Pages

# Useful websites...
# https://vitepress.dev/guide/deploy

# Run workflow on every push to the master branch...
on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch...
  push:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages...
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued...
# However, do NOT cancel in-progress runs as it's desirable to allow these production deployments to complete...
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job...
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # https://github.com/actions/checkout...
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled...
      # - uses: pnpm/action-setup@v3 # Uncomment this if you're using pnpm...
      # - uses: oven-sh/setup-bun@v1 # Uncomment this if you're using Bun...
      - name: Setup Node
        uses: actions/setup-node@v7 # https://github.com/actions/setup-node...
        with:
          node-version: 20
          cache: npm # or pnpm / yarn...
      - name: Setup Pages
        uses: actions/configure-pages@v6 # https://github.com/actions/configure-pages...
      - name: Install dependencies
        run: npm ci # or pnpm install / yarn install / bun install...
      - name: Build with VitePress
        run: npm run docs:build # or pnpm docs:build / yarn docs:build / bun run docs:build...
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5 # https://github.com/actions/upload-pages-artifact...
        with:
          path: docs/.vitepress/dist

  # Deployment job...
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 # https://github.com/actions/deploy-pages...
